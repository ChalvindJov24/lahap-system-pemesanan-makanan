<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lahap — Daftar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/assets/css/login-style.css">
</head>
<body>

<div class="auth-layout">
    <div class="auth-card">

        <h1 class="auth-title">Buat Akun Baru</h1>
        <p class="auth-subtitle">Daftar untuk mulai memesan makanan favorit Anda</p>

        <form id="registerForm" novalidate>

            <!-- Nama Lengkap -->
            <div class="form-group">
                <label for="name" class="auth-label">Nama Lengkap</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  class="auth-form-control"
                  placeholder="John Doe"
                  minlength="2"
                  required
                >
                <div class="invalid-feedback">
                    Nama lengkap minimal 2 karakter.
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email" class="auth-label">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="auth-form-control"
                  placeholder="nama@contoh.com"
                  required
                >
                <div class="invalid-feedback">
                    Email wajib diisi dengan format yang valid.
                </div>
            </div>

            <!-- No. HP -->
            <div class="form-group">
                <label for="phone" class="auth-label">No. Telepon</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="auth-form-control"
                  placeholder="08123456789"
                  pattern="[0-9]{10,15}"
                  required
                >
                <div class="invalid-feedback">
                    Nomor telepon harus 10–15 digit.
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password" class="auth-label">Password</label>
                <div class="password-wrapper">
                    <input
                      type="password"
                      id="password"
                      name="password"
                      class="auth-form-control"
                      placeholder="Masukkan password (min 6 karakter)"
                      minlength="6"
                      required
                    >
                    <button
                      type="button"
                      class="password-toggle"
                      id="togglePassword"
                      aria-label="Toggle password visibility"
                    >
                        <svg class="icon-eye" viewBox="0 0 24 24">
                            <path d="M12 5c-7.633 0-11 7-11 7s3.367 7 11 7 11-7 11-7-3.367-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/>
                            <circle cx="12" cy="12" r="2.5"/>
                        </svg>
                    </button>
                </div>
                <div class="invalid-feedback">
                    Password minimal 6 karakter.
                </div>
            </div>

            <!-- Konfirmasi Password -->
            <div class="form-group">
                <label for="confirmPassword" class="auth-label">Konfirmasi Password</label>
                <div class="password-wrapper">
                    <input
                      type="password"
                      id="confirmPassword"
                      name="confirmPassword"
                      class="auth-form-control"
                      placeholder="Ulangi password"
                      minlength="6"
                      required
                    >
                    <button
                      type="button"
                      class="password-toggle"
                      id="toggleConfirmPassword"
                      aria-label="Toggle password visibility"
                    >
                        <svg class="icon-eye" viewBox="0 0 24 24">
                            <path d="M12 5c-7.633 0-11 7-11 7s3.367 7 11 7 11-7 11-7-3.367-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/>
                            <circle cx="12" cy="12" r="2.5"/>
                        </svg>
                    </button>
                </div>
                <div class="invalid-feedback">
                    Konfirmasi password minimal 6 karakter.
                </div>
            </div>

            <!-- Submit -->
            <div class="form-group">
                <button type="submit" class="btn-auth-primary">
                    Daftar
                </button>
            </div>

            <!-- Link to Login -->
            <div class="text-center">
                <a href="/public/login.html" class="auth-link">
                    Sudah punya akun? Login di sini
                </a>
            </div>

        </form>
    </div>
</div>

<script>
// Password visibility toggle — Password field
const togglePw = document.getElementById('togglePassword');
const pwField  = document.getElementById('password');

if (togglePw && pwField) {
    togglePw.addEventListener('click', () => {
        const type = pwField.getAttribute('type') === 'password' ? 'text' : 'password';
        pwField.setAttribute('type', type);
    });
}

// Password visibility toggle — Confirm field
const toggleConfirm = document.getElementById('toggleConfirmPassword');
const confirmField  = document.getElementById('confirmPassword');

if (toggleConfirm && confirmField) {
    toggleConfirm.addEventListener('click', () => {
        const type = confirmField.getAttribute('type') === 'password' ? 'text' : 'password';
        confirmField.setAttribute('type', type);
    });
}

// Form validation
const form = document.getElementById('registerForm');

form.addEventListener('submit', (e) => {
    e.preventDefault();
    let isValid = true;

    // Reset previous errors
    form.querySelectorAll('.auth-form-control').forEach(input => {
        input.classList.remove('is-invalid');
    });

    // Validate name
    if (!form.name.value.trim() || form.name.value.length < 2) {
        form.name.classList.add('is-invalid');
        isValid = false;
    }

    // Validate email
    if (!form.email.value.trim() || !form.email.checkValidity()) {
        form.email.classList.add('is-invalid');
        isValid = false;
    }

    // Validate phone
    if (!form.phone.value.trim() || !form.phone.checkValidity()) {
        form.phone.classList.add('is-invalid');
        isValid = false;
    }

    // Validate password
    if (!form.password.value || form.password.value.length < 6) {
        form.password.classList.add('is-invalid');
        isValid = false;
    }

    // Validate confirm password
    if (!form.confirmPassword.value || form.confirmPassword.value.length < 6) {
        form.confirmPassword.classList.add('is-invalid');
        isValid = false;
    } else if (form.password.value !== form.confirmPassword.value) {
        form.confirmPassword.classList.add('is-invalid');
        isValid = false;
    }

    if (isValid) {
        // Frontend-only: show success (backend akan ditambahkan)
        alert('Register form valid! (Frontend prototype — backend akan ditambahkan di issue terpisah)');
    }
});
</script>
</body>
</html>
